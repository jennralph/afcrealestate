# XcodeGen spec. Generate the Xcode project with:
#   ./scripts/build-wireguard-go.sh   # once, builds the WireGuard Go bridge
#   xcodegen generate
#   open Harbor.xcodeproj
# Set your Apple team in DEVELOPMENT_TEAM below (or in Xcode) before running
# on a device: Network Extensions only run on real iPhones, not the simulator.
name: Harbor
options:
  bundleIdPrefix: net.harborvpn
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    HARBOR_API_URL: https://api.harborvpn.example
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  HarborCore:
    path: HarborCore
  WireGuardKit:
    path: Vendor/WireGuardKit

targets:
  Harbor:
    type: application
    platform: iOS
    sources:
      - path: Harbor
      - path: Shared
    dependencies:
      - package: HarborCore
      - target: PacketTunnel
      - target: HarborWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.harborvpn.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Supporting/Harbor-Info.plist
      properties:
        CFBundleDisplayName: Harbor
        LSApplicationCategoryType: public.app-category.utilities
        ITSAppUsesNonExemptEncryption: true
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true
        HarborAPIURL: $(HARBOR_API_URL)
        HarborKeychainGroup: $(AppIdentifierPrefix)net.harborvpn.shared
    entitlements:
      path: Supporting/Harbor.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [group.net.harborvpn]
        keychain-access-groups: [$(AppIdentifierPrefix)net.harborvpn.shared]
        com.apple.developer.networking.wifi-info: true

  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
      - path: Shared/Common
    dependencies:
      - package: HarborCore
      - package: WireGuardKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.harborvpn.app.tunnel
    info:
      path: Supporting/PacketTunnel-Info.plist
      properties:
        CFBundleDisplayName: Harbor Tunnel
        HarborKeychainGroup: $(AppIdentifierPrefix)net.harborvpn.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: Supporting/PacketTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [group.net.harborvpn]
        keychain-access-groups: [$(AppIdentifierPrefix)net.harborvpn.shared]

  HarborWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: HarborWidgets
      - path: Shared
    dependencies:
      - package: HarborCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.harborvpn.app.widgets
    info:
      path: Supporting/HarborWidgets-Info.plist
      properties:
        CFBundleDisplayName: Harbor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Supporting/HarborWidgets.entitlements
      properties:
        # Lets the Control Center toggle and widget buttons start/stop the VPN.
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [group.net.harborvpn]

schemes:
  Harbor:
    build:
      targets:
        Harbor: all
    run:
      config: Debug
    archive:
      config: Release
